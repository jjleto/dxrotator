name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Il nucleo (geo, dxcc, rotor, sources, engine, bands) non dipende da Qt:
      # i test girano senza installare PySide6.
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  gui:
    name: GUI import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Anche con la piattaforma "offscreen", libQt6Gui va comunque collegata a
      # libEGL, libxkbcommon, libdbus e fontconfig, che sul runner non ci sono.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-6 libxcb1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Import GUI headless
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_smoke.py
