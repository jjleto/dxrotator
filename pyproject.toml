[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxrotator"
version = "1.7.0"
description = "Hy-Gain T2X rotator control (DCU-1) driven by WSJT-X and N1MM+"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luigi Giusti, IW5DNZ" }]
keywords = ["hamradio", "rotator", "dcu-1", "hygain", "wsjt-x", "n1mm"]
dependencies = [
    "PySide6>=6.5",
    "pyserial>=3.5",
]

[project.scripts]
dxrotator = "dxrotator.__main__:main"

[tool.setuptools]
packages = ["dxrotator"]
